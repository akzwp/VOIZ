}
body #chat .chat-inner > .panel-group > .panel > .panel-heading a { color: var(--voiz-text-soft); }
body #chat .chat-inner > .panel-group > .panel > .panel-heading:hover a { color: var(--voiz-text); }


/* ============================================================
   VOIZ UI v2 PATCH  (round 2 - gap fixes found in audit)
   ------------------------------------------------------------
   Neuters legacy layers (table.css / styles.css / header.css /
   widgets.css / applet.css / rightbar.css / rtl.css) that still
   win on specificity, and adds the missing component polish:
   tabs, badges, labels, export flyout, applets, sticky note,
   login error scale, module-search dropdown, RTL form details.
   ============================================================ */

/* ---------- legacy table.css kills (#13) ---------- */
/* dark table headers + ltr tds were leaking through by specificity */
table.issabel-standard-table > thead > tr,
table.issabel-standard-table > tfoot > tr {
    font-family: "Vazirmatn", sans-serif;
    color: var(--voiz-heading);
    text-align: right;
    height: auto;
}
table.issabel-standard-table > thead > tr > th,
table.issabel-standard-table > tfoot > tr > th {
    text-indent: 0;
    padding: 11px 14px;
    color: var(--voiz-heading);
    background-color: var(--voiz-surface-2);
    border-bottom: 2px solid var(--voiz-border);
    font-weight: 700;
    font-size: 12px;
    white-space: nowrap;
}
table.issabel-standard-table > thead > tr > th a.link_summary_off,
table.issabel-standard-table > tfoot > tr > th a.link_summary_off {
    color: var(--voiz-text-soft);
}
table.issabel-standard-table > thead > tr > th a.link_summary_on,
table.issabel-standard-table > tfoot > tr > th a.link_summary_on {
    color: var(--voiz-primary);
    font-weight: 700;
}
table.issabel-standard-table > thead > tr > td,
table.issabel-standard-table > tfoot > tr > td {
    text-indent: 0;
    padding: 8px 14px;
    background-color: var(--voiz-surface-2);
    color: var(--voiz-heading);
}
table.issabel-standard-table > tbody > tr {
    background-color: var(--voiz-surface);
}
table.issabel-standard-table > tbody > tr:hover {
    background-color: var(--voiz-surface-2);
}
table.issabel-standard-table > tbody > tr > td {
    font-family: "Vazirmatn", sans-serif;
    color: var(--voiz-text-soft);
    font-size: 12.5px;
    text-indent: 0;
    border-bottom: 1px solid var(--voiz-border);
    padding: 10px 14px;
    background-color: transparent;
    text-align: right;
    direction: rtl;
}
table.issabel-standard-table td.table_data_last_row {
    color: var(--voiz-text-soft);
    border-bottom: 0;
    text-align: right;
}

/* toolbar: legacy fixed height 39px + float broke wrapping/responsive */
form.issabel-standard-formgrid .neo-table-header-row,
form.issabel-standard-formgrid div.neo-table-header-row {
    float: none !important;
    height: auto !important;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background-color: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius);
    box-shadow: var(--voiz-card-shadow);
}
form.issabel-standard-formgrid .neo-table-header-row-filter {
    float: none !important;
    display: inline-flex !important;
    align-items: center;
    gap: 6px;
    padding: 0;
    height: auto;
    cursor: default;
}
form.issabel-standard-formgrid .neo-table-header-row-navigation {
    float: none !important;
    height: auto;
    margin-right: auto;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
form.issabel-standard-formgrid .neo-table-header-row input[type="text"] {
    height: 32px;
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius-sm);
    background: var(--voiz-input-bg);
    color: var(--voiz-text);
    padding: 0 10px;
}

/* toolbar buttons: legacy dark-blue flat buttons */
.neo-table-toolbar-button {
    float: none !important;
    position: static;
    margin: 0;
    color: var(--voiz-text-soft);
    background-color: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: 8px;
    padding: 0 14px;
    height: 32px;
    font-size: 12px;
    font-weight: 600;
    font-family: "Vazirmatn", sans-serif;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all .15s ease;
}
.neo-table-toolbar-button:hover {
    border-color: var(--voiz-primary);
    background-color: var(--voiz-primary-soft);
    color: var(--voiz-primary);
}
.neo-table-toolbar-button i { color: inherit; }
/* a11y recolor of inline hard-coded icon colors in the export flyout */
.neo-table-toolbar-button i[style*="color:#99c"],
.neo-table-toolbar-button i[style*="color:#99C"] { color: var(--voiz-info) !important; }
.neo-table-toolbar-button i[style*="color:green"] { color: var(--voiz-success) !important; }
.neo-table-toolbar-button i[style*="color:red"] { color: var(--voiz-danger) !important; }

/* paired filter/download buttons (left+caret) - rebuild as one pill */
.neo-table-button-filter-left,
.neo-table-button-filter-right {
    float: none !important;
    margin: 0 !important;
    height: 32px !important;
    padding: 0 12px !important;
    border: 1px solid var(--voiz-border) !important;
    border-radius: 8px !important;
    background-color: var(--voiz-surface) !important;
    color: var(--voiz-text-soft) !important;
    font-size: 12px !important;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all .15s ease;
}
.neo-table-button-filter-left:hover,
.neo-table-button-filter-right:hover {
    border-color: var(--voiz-primary) !important;
    background-color: var(--voiz-primary-soft) !important;
    color: var(--voiz-primary) !important;
}
/* visually join the button + caret pair.
   DOM: [button][caret] - in RTL the button sits RIGHT of its caret,
   so the caret is pulled against the button's left edge. */
.neo-table-button-filter-left + .neo-table-button-filter-right {
    margin-right: -9px !important;
    border-top-right-radius: 0 !important;
    border-bottom-right-radius: 0 !important;
}
@supports selector(a:has(b)) {
    .neo-table-button-filter-left:has(+ .neo-table-button-filter-right) {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
    }
}

/* pagination input inside toolbar */
.neo-table-header-row-navigation input[type="text"] {
    width: 44px;
    height: 28px;
    text-align: center;
}

/* ---------- filter row: was position:absolute @ top:40px ---------- */
#neo-table-header-filterrow {
    position: static !important;
    width: auto;
    margin-top: 0 !important;
    margin-bottom: 14px;
    opacity: 1;
    filter: none;
    z-index: auto;
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius);
    background-color: var(--voiz-surface-2);
    padding: 14px 16px;
    box-shadow: none;
}
#neo-table-header-filterrow.neo-display-none { display: none; }
#neo-table-header-filterrow input[type="text"] {
    height: 32px;
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius-sm);
    background: var(--voiz-input-bg);
}

/* ---------- export flyout (.subMenu / .items) ---------- */
.subMenu { margin: 4px 0 0; z-index: 1200; }
.subMenu .items {
    background: var(--voiz-surface);
    color: var(--voiz-text-soft);
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius-sm);
    box-shadow: var(--voiz-popover-shadow);
    padding: 6px;
    min-width: 170px;
    font: 400 12.5px "Vazirmatn", sans-serif;
    animation: voiz-fade .15s ease;
}
.subMenu .items a { text-decoration: none; color: var(--voiz-text-soft); }
.subMenu .menuItem {
    height: auto;
    padding: 0;
    font: 400 12.5px "Vazirmatn", sans-serif;
    border-radius: 6px;
    overflow: hidden;
}
.subMenu .menuItem a {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    color: var(--voiz-text-soft);
    transition: all .12s ease;
}
.subMenu .menuItem a:hover { background: var(--voiz-primary-soft); color: var(--voiz-primary); }

/* ---------- generic .button (widgets.css) & submit leftovers ---------- */
.button,
input.button,
input.submit,
INPUT.submit {
    background-color: var(--voiz-primary);
    background-image: none;
    border: 1px solid var(--voiz-primary);
    color: var(--voiz-primary-contrast);
    height: 34px;
    padding: 0 16px;
    font-size: 12.5px;
    font-weight: 600;
    font-family: "Vazirmatn", sans-serif;
    border-radius: var(--voiz-radius-sm);
    cursor: pointer;
    transition: all .15s ease;
}
.button:hover, .button:active,
input.button:hover, input.submit:hover {
    background-color: var(--voiz-primary-hover);
    border-color: var(--voiz-primary-hover);
    color: #fff;
}

/* ---------- applets (dashboard boxes) ---------- */
div.neo-applet {
    float: right;
    width: calc(50% - 10px);
    min-width: 300px;
    height: auto;
    min-height: 220px;
    margin: 0 0 14px 14px;
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius);
    box-shadow: var(--voiz-card-shadow);
}
@media (max-width: 900px) {
    div.neo-applet { width: 100%; margin-left: 0; }
}
div.neo-applet-title {
    position: static;
    padding: 12px 16px 0;
    font: 600 13.5px "Vazirmatn", sans-serif;
    color: var(--voiz-heading);
    text-shadow: none;
}
div.neo-applet-content {
    position: static;
    width: auto;
    padding: 10px 16px 14px;
    color: var(--voiz-text-soft);
    font-size: 12.5px;
}
div.neo-applet-reload a { color: var(--voiz-muted); }
div.neo-applet-reload a:hover { color: var(--voiz-primary); }

/* ---------- sticky note ---------- */
#neo-sticky-note #neo-sticky-note-text {
    color: var(--voiz-text);
    font-family: "Vazirmatn", sans-serif;
    padding: 14px;
}
#neo-sticky-note #neo-sticky-note-text-edit {
    padding: 12px 14px;
}
#neo-sticky-note #neo-sticky-note-text-edit textarea {
    width: 100%;
    min-height: 90px;
    background: var(--voiz-inset);
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius-sm);
    color: var(--voiz-text);
    font-family: "Vazirmatn", sans-serif;
    font-size: 12.5px;
    padding: 9px 10px;
}
#neo-sticky-note #neo-submit-button {
    background: var(--voiz-primary);
    border: 1px solid var(--voiz-primary);
    color: var(--voiz-primary-contrast);
    border-radius: var(--voiz-radius-sm);
    height: 32px;
    padding: 0 18px;
    font-family: "Vazirmatn", sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
}
#neo-sticky-note #neo-submit-button:hover { background: var(--voiz-primary-hover); }
#neo-sticky-note #auto-popup {
    color: var(--voiz-muted);
    font-size: 11.5px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
}
#neo-sticky-note-text-char-count { color: var(--voiz-muted); font-size: 11px; margin-top: 4px; }

/* ---------- tabs (nav-tabs) ---------- */
.nav-tabs {
    border-bottom: 1px solid var(--voiz-border);
}
.nav-tabs > li > a {
    color: var(--voiz-text-soft);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--voiz-radius-sm) var(--voiz-radius-sm) 0 0;
    margin-right: 4px;
    font-family: "Vazirmatn", sans-serif;
    font-size: 12.5px;
}
.nav-tabs > li > a:hover { background: var(--voiz-surface-2); color: var(--voiz-text); border-color: transparent; }
.nav-tabs > li.active > a,
.nav-tabs > li.active > a:hover,
.nav-tabs > li.active > a:focus {
    color: var(--voiz-primary);
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-bottom-color: var(--voiz-surface);
    font-weight: 600;
}

/* ---------- labels & badges ---------- */
.label,
.badge {
    font-family: "Vazirmatn", sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    text-shadow: none;
}
.label-default { background: var(--voiz-surface-3); color: var(--voiz-text-soft); }
.label-primary { background: var(--voiz-primary); color: #fff; }
.label-success { background: var(--voiz-success); color: #fff; }
.label-info    { background: var(--voiz-info); color: #fff; }
.label-warning { background: var(--voiz-warning); color: #fff; }
.label-danger  { background: var(--voiz-danger); color: #fff; }
.badge { background: var(--voiz-surface-3); color: var(--voiz-text); }

/* ---------- alerts: readable icon + dismiss alignment ---------- */
.alert .close { color: inherit; opacity: .6; text-shadow: none; }
.alert .close:hover { opacity: 1; }

/* ---------- div_msg_errors: title/eye icon on the right (RTL) ---------- */
div.div_msg_errors .div_msg_errors_title {
    float: none;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 0 0 auto;
}
div.div_msg_errors .div_msg_errors_title i.fa {
    font-size: 16px;
    line-height: 1;
}
div.div_msg_errors .div_msg_errors_content {
    margin: 0 !important;
    padding: 0;
}

/* ---------- breadcrumb & footer hard-coded inline colors ---------- */
footer.main a { color: var(--voiz-muted) !important; }
footer.main a:hover { color: var(--voiz-primary) !important; }
footer.main { text-align: center; }

/* ---------- horizontal scroll guard on narrow screens ---------- */
#neo-contentbox-maincolumn { min-width: 0; overflow-x: hidden; }
img { max-width: 100%; height: auto; }

/* ---------- modals: enter animation ---------- */
.modal .modal-content { animation: voiz-pop .18s ease; }
@keyframes voiz-pop {
    from { opacity: 0; transform: scale(.96); }
    to   { opacity: 1; transform: none; }
}

/* ---------- login: remove legacy fixed height cap ---------- */
body.login-page #login { max-width: 100%; width: 100%; }
body.login-page .login-wrapper { max-width: 420px; }

/* password visibility toggle (injected by voiz-ui.js) */
.voiz-pass-toggle {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border: none;
    background: transparent;
    color: var(--voiz-muted);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color .15s ease, background .15s ease;
}
.voiz-pass-toggle:hover { color: var(--voiz-primary); background: var(--voiz-primary-soft); }
/* room so the toggle never overlaps the caret in RTL inputs */
body.login-page #login input[type="password"],
body.login-page #login input[type="text"][name="input_pass"] {
    padding-left: 40px;
}

/* ============================================================
   VOIZ UI v2 - COMPONENT POLISH (round 2)
   ============================================================ */

/* ---------- module search dropdown (topbar) ---------- */
.voiz-search-results {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    left: 0;
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius-sm);
    box-shadow: var(--voiz-popover-shadow);
    max-height: 320px;
    overflow-y: auto;
    padding: 6px;
    z-index: 1300;
    display: none;
}
.voiz-search-results.voiz-open { display: block; animation: voiz-fade .15s ease; }
.voiz-search-group-label {
    color: var(--voiz-muted);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .3px;
    padding: 6px 8px 2px;
}
.voiz-search-results a.voiz-search-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;
    border-radius: 6px;
    color: var(--voiz-text-soft);
    font-size: 12.5px;
    text-decoration: none;
}
.voiz-search-results a.voiz-search-item i { width: 16px; text-align: center; color: var(--voiz-muted); }
.voiz-search-results a.voiz-search-item:hover,
.voiz-search-results a.voiz-search-item.voiz-active {
    background: var(--voiz-primary-soft);
    color: var(--voiz-primary);
}
.voiz-search-results a.voiz-search-item:hover i,
.voiz-search-results a.voiz-search-item.voiz-active i { color: var(--voiz-primary); }
.voiz-search-empty {
    color: var(--voiz-muted);
    font-size: 12px;
    padding: 10px;
    text-align: center;
}

/* ---------- sidebar v2 polish (#6) ---------- */
/* active accent bar must sit on the OUTER (right) edge in RTL */
body .page-container .sidebar-menu #main-menu li.active > a {
    box-shadow: inset -3px 0 0 0 var(--voiz-primary);
}
/* smooth submenu expand/collapse (neon toggles .visible) */
.page-container .sidebar-menu #main-menu li ul {
    transition: none; /* neon slides via height; keep native */
}
/* section separation & breathing room */
.page-container .sidebar-menu #main-menu > li + li { margin-top: 2px; }
/* logo fade while collapsed handled inline (transition on img) */
.page-container .sidebar-menu .logo-env > div.logo img {
    transition: opacity .2s ease;
}
/* hover affordance for rows with children */
.page-container .sidebar-menu #main-menu li.has-sub > a:hover:before { color: var(--voiz-primary); }

/* ---------- sidebar is always a fixed rail (independent of legacy CSS) ---------- */
body .page-container .sidebar-menu {
    position: fixed;
    top: 0;
    bottom: 0;
    right: 0;
    left: auto;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
}

/* ---------- sidebar scroll shadow ---------- */
body .page-container .sidebar-menu {
    background-image: linear-gradient(var(--voiz-border), transparent 24px);
    background-repeat: no-repeat;
    background-size: 100% 24px;
    background-position: 0 66px;
    background-attachment: local;
}

/* ---------- popup close hover color ---------- */
.neo-modal-issabel-popup-close:hover:before,
.neo-modal-issabel-popup-close:hover:after { background: var(--voiz-danger); }

/* ---------- inputs: number/spinner + full-width-in-forms default ---------- */
input[type="text"], input[type="password"], input[type="email"],
input[type="number"], input[type="tel"], input[type="search"] {
    max-width: 100%;
}

/* ---------- fixes for very wide monitors: content max width ---------- */
@media (min-width: 1600px) {
    #neo-contentbox-maincolumn {
        max-width: 1560px;
        margin: 0 auto;
    }
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}


/* ============================================================
   VOIZ UI v3  (round 3 - full responsiveness + sidebar rebuild
   + AKZ co-branding)
   ------------------------------------------------------------
   1) rtl.css applies padding-right:280px !important at ALL widths
      -> mobile/tablet content was squeezed to 160px. Neutralized.
   2) neon-api.js animates LTR padding-left + inline styles on
      #main-menu/submenus -> broke the RTL sidebar. We disable its
      animated path (see voiz-ui.js) and style the collapse here.
   3) Forms / lists / content now scale on every monitor.
   ============================================================ */

/* ---------- 1) kill rtl.css hardcoded layout (ALL widths) ---------- */
@media all {
    .page-container {
        padding-right: 280px !important;
        padding-left: 0 !important;
    }
    .page-container.sidebar-collapsed { padding-right: 65px !important; }
    /* tablet/mobile: drawer instead of rail */
    @media (max-width: 991px) {
        .page-container,
        .page-container.sidebar-collapsed {
            padding-right: 0 !important;
            padding-left: 0 !important;
        }
    }
}

/* legacy fit_main_content_height() writes inline min-heights that
   fight the fixed sidebar - clamp them */
.page-container .sidebar-menu,
.page-container .main-content {
    min-height: 0 !important;
}

/* ---------- 2) SIDEBAR REBUILD (#6) ---------- */

/* top-level groups: consistent rows, separators between sections */
body .page-container .sidebar-menu #main-menu {
    padding: 12px 10px 24px;
}
body .page-container .sidebar-menu #main-menu > li {
    margin: 0 0 2px;
}
body .page-container .sidebar-menu #main-menu > li > a {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 42px;
    padding: 9px 14px;
    border-radius: 10px;
    color: var(--voiz-sidebar-text);
    font-size: 13.5px;
    line-height: 1.5;
}
body .page-container .sidebar-menu #main-menu > li > a > i {
    flex: 0 0 20px;
    width: 20px;
    text-align: center;
    font-size: 15px;
    color: var(--voiz-muted);
    transition: color .15s ease;
}
body .page-container .sidebar-menu #main-menu > li > a > span {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
/* chevron on the LEFT edge (RTL end) for items with children */
body .page-container .sidebar-menu #main-menu > li.has-sub > a::after {
    content: "\f104";
    font-family: "FontAwesome";
    flex: 0 0 auto;
    order: 3;
    margin-right: auto;
    padding: 0 2px 0 8px;
    font-size: 12px;
    color: var(--voiz-muted);
    transition: transform .2s ease;
}
body .page-container .sidebar-menu #main-menu > li.has-sub.opened > a::after {
    transform: rotate(-90deg);
}

/* active state: soft bg + outer-edge accent bar */
body .page-container .sidebar-menu #main-menu > li.active > a,
body .page-container .sidebar-menu #main-menu > li.opened.active > a {
    background: var(--voiz-sidebar-active-bg);
    color: var(--voiz-sidebar-text-act);
    font-weight: 600;
}
body .page-container .sidebar-menu #main-menu > li.active > a::before {
    content: "";
    position: absolute;
    right: -10px;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 3px;
    background: var(--voiz-primary);
}
body .page-container .sidebar-menu #main-menu > li > a:hover {
    background: var(--voiz-sidebar-item-hover);
    color: var(--voiz-sidebar-text-act);
}
body .page-container .sidebar-menu #main-menu > li > a:hover i,
body .page-container .sidebar-menu #main-menu > li.active > a i {
    color: var(--voiz-primary);
}

/* submenus: aligned rail, comfortable rows, 3rd level too */
body .page-container .sidebar-menu #main-menu li ul {
    margin: 4px 20px 6px 10px;
    padding: 0 0 0 0;
    border-right: 2px solid var(--voiz-border);
    background: transparent;
}
body .page-container .sidebar-menu #main-menu li ul > li > a {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 36px;
    padding: 7px 12px;
    border-radius: 8px;
    color: var(--voiz-sidebar-sub-text);
    font-size: 12.5px;
    line-height: 1.5;
}
body .page-container .sidebar-menu #main-menu li ul > li > a > span {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
body .page-container .sidebar-menu #main-menu li ul > li > a:hover {
    background: var(--voiz-sidebar-item-hover);
    color: var(--voiz-sidebar-text-act);
}
body .page-container .sidebar-menu #main-menu li ul > li.active > a {
    background: var(--voiz-sidebar-active-bg);
    color: var(--voiz-primary);
    font-weight: 600;
}
body .page-container .sidebar-menu #main-menu li ul > li ul {
    margin: 2px 14px 4px 8px;
    border-right-color: var(--voiz-border);
}

/* 3rd+ level links: kill legacy blue underline, keep rows tidy */
body .page-container .sidebar-menu #main-menu li ul li ul li a,
body .page-container .sidebar-menu #main-menu li ul li ul li ul li a,
body .page-container .sidebar-menu #main-menu a {
    text-decoration: none;
}
body .page-container .sidebar-menu #main-menu li ul li ul li a {
    min-height: 34px;
    padding: 6px 10px;
    color: var(--voiz-sidebar-sub-text);
    font-size: 12px;
}
body .page-container .sidebar-menu #main-menu li ul li ul li a:hover {
    background: var(--voiz-sidebar-item-hover);
    color: var(--voiz-sidebar-text-act);
}
body .page-container .sidebar-menu #main-menu li ul li ul li.active a {
    background: var(--voiz-sidebar-active-bg);
    color: var(--voiz-primary);
    font-weight: 600;
}

/* mobile: hide the desktop collapse burger inside the sidebar header */
@media (max-width: 991px) {
    body .page-container .sidebar-menu .logo-env > div.sidebar-collapse { display: none; }
    body .page-container .sidebar-menu .logo-env > div.sidebar-mobile-menu {
        display: block;
    }
    body .page-container .sidebar-menu .logo-env > div.sidebar-mobile-menu a {
        border: 1px solid var(--voiz-sidebar-border);
        border-radius: 8px;
        padding: 4px 8px;
        color: var(--voiz-sidebar-collapse);
    }
    body .page-container .sidebar-menu .logo-env {
        justify-content: space-between;
        display: flex;
        align-items: center;
    }
}

/* collapsed (desktop) : 65px icon rail + flyout */
body .page-container.sidebar-collapsed .sidebar-menu {
    width: 65px !important;
}
body .page-container.sidebar-collapsed .sidebar-menu .logo-env {
    padding: 14px 8px;
}
body .page-container.sidebar-collapsed .sidebar-menu .logo-env > div.logo,
body .page-container.sidebar-collapsed .sidebar-menu .logo-env > div.sidebar-collapse {
    display: none;
}
body .page-container.sidebar-collapsed .sidebar-menu .logo-env {
    justify-content: center;
    display: flex;
}
body .page-container.sidebar-collapsed .sidebar-menu #main-menu {
    padding: 10px 8px;
}
body .page-container.sidebar-collapsed .sidebar-menu #main-menu > li > a {
    justify-content: center;
    padding: 10px 0;
}
body .page-container.sidebar-collapsed .sidebar-menu #main-menu > li > a > span,
body .page-container.sidebar-collapsed .sidebar-menu #main-menu > li.has-sub > a::after {
    display: none;
}
body .page-container.sidebar-collapsed .sidebar-menu #main-menu > li > a i {
    margin: 0;
}
body .page-container.sidebar-collapsed .sidebar-menu #main-menu > li.active > a::before {
    right: auto;
    left: 8px;
    top: 12px;
    bottom: 12px;
}
body .page-container.sidebar-collapsed .sidebar-menu #main-menu > li > ul {
    display: none;
    position: absolute;
    right: 65px;
    top: 0;
    width: 250px;
    max-height: 70vh;
    overflow-y: auto;
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: 10px;
    box-shadow: var(--voiz-popover-shadow);
    padding: 6px;
    margin: 0;
}
body .page-container.sidebar-collapsed .sidebar-menu #main-menu > li:hover > ul,
body .page-container.sidebar-collapsed .sidebar-menu #main-menu > li > ul.visible {
    display: block;
}

/* mobile/tablet drawer (<992px) */
@media (max-width: 991px) {
    body .page-container .sidebar-menu {
        position: fixed !important;
        top: 0;
        bottom: 0;
        right: 0;
        left: auto;
        width: 285px !important;
        max-width: 86vw;
        transform: translateX(105%);
        transition: transform .28s ease;
        box-shadow: -10px 0 44px rgba(0, 0, 0, .35);
        z-index: 10650;
    }
    body.voiz-sidebar-open .page-container .sidebar-menu {
        transform: translateX(0);
    }
    /* drawer always expanded vertically, never collapsed */
    body.voiz-sidebar-open .page-container.sidebar-collapsed .sidebar-menu {
        width: 285px !important;
    }
    body.voiz-sidebar-open .page-container.sidebar-collapsed .sidebar-menu #main-menu > li > a > span {
        display: inline;
    }
    body.voiz-sidebar-open .page-container.sidebar-collapsed .sidebar-menu #main-menu > li.has-sub > a::after {
        display: block;
    }
    body.voiz-sidebar-open .page-container.sidebar-collapsed .sidebar-menu #main-menu > li > ul {
        position: static;
        width: auto;
        max-height: none;
        box-shadow: none;
        border: none;
        border-right: 2px solid var(--voiz-border);
        border-radius: 0;
        background: transparent;
        padding: 0;
        margin: 4px 20px 6px 10px;
    }
    .voiz-sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(8, 10, 14, .55);
        z-index: 10640;
        opacity: 0;
        visibility: hidden;
        transition: opacity .22s ease, visibility .22s ease;
        cursor: pointer;
    }
    body.voiz-sidebar-open .voiz-sidebar-overlay {
        opacity: 1;
        visibility: visible;
    }
}
@media (min-width: 992px) {
    .voiz-sidebar-overlay { display: none; }
}

/* ---------- 3) FULL RESPONSIVENESS (#3 #4 #7) ---------- */

/* forms: two-column grid on wide screens via natural table flow,
   single column on narrow; inputs always usable */
@media (max-width: 767px) {
    table.tabForm,
    table.tabForm tbody,
    table.tabForm tr,
    table.tabForm td {
        display: block;
        width: 100% !important;
    }
    table.tabForm td {
        padding: 4px 0;
    }
    table.tabForm td b,
    table.tabForm td label {
        display: block;
        margin-bottom: 4px;
    }
    table.tabForm input[type="text"],
    table.tabForm input[type="password"],
    table.tabForm select,
    table.tabForm textarea {
        width: 100% !important;
        max-width: 100% !important;
    }
    .filterForm,
    form.filterForm {
        padding: 12px;
    }
    .fila_botonera {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: stretch;
    }
    .fila_botonera input[type="submit"],
    .fila_botonera input[type="button"],
    .fila_botonera .button {
        flex: 1 1 auto;
    }
}

/* lists/grids: legacy tables become scrollable, not broken */
.voiz-table-scroll {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
table.issabel-standard-table,
table.tabla_listado {
    min-width: 640px;
}
@media (max-width: 991px) {
    form.issabel-standard-formgrid {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }
    form.issabel-standard-formgrid > table.issabel-standard-table {
        min-width: 720px;
    }
}

/* legacy tables the modules render without our wrapper classes */
@media (max-width: 767px) {
    #neo-contentbox table.tabla_listado,
    #neo-contentbox table.listDataTable,
    #neo-contentbox .table-responsive > table {
        min-width: 640px;
    }
    #neo-contentbox .neo-module-content {
        overflow-x: auto;
    }
}

/* toolbar on small screens: full-width search + stacked controls */
@media (max-width: 767px) {
    form.issabel-standard-formgrid .neo-table-header-row {
        padding: 10px;
    }
    form.issabel-standard-formgrid .neo-table-header-row-filter {
        display: flex !important;
        width: 100%;
    }
    form.issabel-standard-formgrid .neo-table-header-row-filter input[type="text"],
    form.issabel-standard-formgrid .neo-table-header-row-filter select {
        flex: 1 1 auto;
        min-width: 0;
        width: auto !important;
        max-width: 100%;
    }
    form.issabel-standard-formgrid .neo-table-header-row-navigation {
        width: 100%;
        justify-content: center;
        margin-right: 0;
        padding: 6px 0 0;
        border-top: 1px dashed var(--voiz-border);
        margin-top: 6px;
    }
}

/* generic tables inside config modules: force usable widths */
table.tabForm input[type="text"],
table.tabForm input[type="password"],
table.tabForm select {
    max-width: 100%;
}
table.tabForm textarea {
    max-width: 100%;
}

/* pre/code blocks (config viewer modules) wrap instead of overflow */
.pre, pre, code {
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
}

/* content column never overflows its parent */
#neo-contentbox, #neo-contentbox-maincolumn, .neo-module-content {
    max-width: 100%;
    min-width: 0;
}
.neo-module-content > * {
    max-width: 100%;
}

/* bootstrapped rows/columns inside modules keep sane gutters */
.row { margin-right: -8px; margin-left: -8px; }
.row > [class*="col-"] { padding-right: 8px; padding-left: 8px; }

/* inline action buttons in table rows wrap gracefully */
td.table_data .neo-table-toolbar-button,
td .button {
    margin: 2px 0;
}

/* AKZ co-branding footer strip */
.voiz-footer-brands {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 4px 10px;
}

                        <input type="password" class="form-control" name="input_pass" id="input_pass" placeholder="رمز عبور" autocomplete="off">
                    </div>
                    <div class="voiz-login-field">
                        <input name="submit_login" type="submit" value="ورود">
                    </div>
                </fieldset>
            </form>
        </div>

                </p>
                <p class="voiz-login-brands">
                    Powered by <a href="https://akzwp.com" target="_blank" rel="noopener">AKZ</a><span class="sep">|</span><a href="https://akzwp.ir" target="_blank" rel="noopener">akzwp.ir</a>

<script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
<script>/* VOIZ - UI layer: theme switch, mobile sidebar drawer, dropdown hygiene,
   module search, login password toggle, popup hygiene (UI only). */
(function ($) {
    'use strict';

    var THEME_KEY = 'voiz-theme';

    var get = function (key) {
        try {
            return localStorage.getItem(key);
        } catch (e) {
            return null;
        }
    };
    var set = function (key, val) {
        try {
            localStorage.setItem(key, val);
        } catch (e) { /* ignored */ }
    };

    function applyTheme(theme, persist) {
        if (theme !== 'dark' && theme !== 'light') {
            theme = 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (persist !== false) {
            set(THEME_KEY, theme);
        }
        syncToggleIcons(theme);
    }

    function currentTheme() {
        return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }

    function initTheme() {
        var saved = get(THEME_KEY);
        applyTheme(saved, false);
    }

    function syncToggleIcons(theme) {
        var icon = theme === 'dark' ? 'fa-sun-o' : 'fa-moon-o';
        if (window.jQuery) {
            jQuery('.voiz-theme-toggle i, .voiz-login-theme i')
                .removeClass('fa-sun-o fa-moon-o')
                .addClass(icon);
        }
    }

    function toggleTheme() {
        applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
    }

    function closeSidebar() {
        jQuery('body').removeClass('voiz-sidebar-open');
    }

    function initSidebarDrawer() {
        var overlay = jQuery('#voiz-sidebar-overlay');
        jQuery(document).on('click', '.voiz-topbar-burger, .sidebar-mobile-menu a', function (e) {
            e.preventDefault();
            e.stopPropagation();
            jQuery('body').toggleClass('voiz-sidebar-open');
            return false;
        });
        overlay.on('click', closeSidebar);
        jQuery(document).on('keyup', function (e) {
            if (e.keyCode === 27) {
                closeSidebar();
            }
        });
    }

    function initOutsideClose() {
        jQuery(document).on('click', function (e) {
            var $target = jQuery(e.target);
            if (!$target.closest('.voiz-topbar-actions').length &&
                !$target.closest('.voiz-topbar-user').length &&
                !$target.closest('.voiz-topbar-search').length) {
                jQuery('.voiz-topbar-actions .open, .voiz-topbar-user .open').removeClass('open');
            }
        });
    }

    /* ------------------------------------------------------------
       Module search (topbar) - live dropdown over #main-menu
       ------------------------------------------------------------ */
    function initModuleSearch() {
        var $input = jQuery('#search_module_issabel');
        if (!$input.length) { return; }

        var $box = jQuery('#voiz-search-results');
        if (!$box.length) {
            $box = jQuery('<div id="voiz-search-results" class="voiz-search-results" role="listbox"></div>');
            $input.closest('div').append($box);
        }
        var $form = $input.closest('form');

        function close() {
            $box.removeClass('voiz-open').empty();
        }

        function render(matches, q) {
            $box.empty();
            if (!matches.length) {
                $box.append(jQuery('<div class="voiz-search-empty"></div>')
                    .text(q ? 'نتیجه‌ای یافت نشد' : 'برای جستجو تایپ کنید'));
            } else {
                $box.append(jQuery('<div class="voiz-search-group-label"></div>').text('ماژول‌ها'));
                matches.forEach(function (m, idx) {
                    var $a = jQuery('<a class="voiz-search-item" role="option"></a>')
                        .attr('href', m.href)
                        .attr('id', 'voiz-search-opt-' + idx)
                        .html('<i class="' + (m.icon || 'fa fa-th-large') + '"></i><span></span>');
                    $a.find('span').text(m.name);
                    $box.append($a);
                });
            }
            $box.addClass('voiz-open');
        }

        function collect() {
            var out = [];
            var seen = {};
            jQuery('#main-menu a[href*="index.php?menu="]').each(function () {
                var $a = jQuery(this);
                var name = jQuery.trim($a.find('span').first().text());
                var href = $a.attr('href');
                if (!name || !href || seen[href]) { return; }
                seen[href] = true;
                out.push({
                    name: name,
                    href: href,
                    icon: ($a.find('i').attr('class') || 'fa fa-th-large')
                });
            });
            return out;
        }

        var index = null;
        var deb;
        $input.on('input', function () {
            var q = jQuery.trim($input.val());
            if (!q) { close(); return; }
            if (!index) { index = collect(); }
            clearTimeout(deb);
            deb = setTimeout(function () {
                var ql = q.toLowerCase();
                var matches = index.filter(function (m) {
                    return m.name.toLowerCase().indexOf(ql) !== -1;
                }).slice(0, 12);
                render(matches, q);
            }, 120);
        });

        $input.on('keydown', function (e) {
            var $items = $box.find('a.voiz-search-item');
            if (e.keyCode === 27) { close(); return; }
            if (!$items.length) { return; }
            var $cur = $items.filter('.voiz-active');
            if (e.keyCode === 40 || e.keyCode === 38) {           /* down / up */
                e.preventDefault();
                var next = e.keyCode === 40 ? $cur.index() + 1 : $cur.index() - 1;
                if (next < 0) { next = $items.length - 1; }
                if (next >= $items.length) { next = 0; }
                $items.removeClass('voiz-active');
                $items.eq(next).addClass('voiz-active');
            } else if (e.keyCode === 13 && $cur.length) {          /* enter */
                e.preventDefault();
                window.location.href = $cur.attr('href');
            }
        });

        $box.on('mousedown', 'a.voiz-search-item', function (e) {
            e.preventDefault();
            window.location.href = jQuery(this).attr('href');
        });
        $input.on('blur', function () { setTimeout(close, 180); });
        $form.on('submit', function (e) {
            var $cur = $box.find('a.voiz-search-item.voiz-active');
            if ($cur.length) {
                e.preventDefault();
                window.location.href = $cur.attr('href');
            }
        });
    }

    /* ------------------------------------------------------------
       Login page: show/hide password (UI only)
       ------------------------------------------------------------ */
    function initLoginPasswordToggle() {
        var $pass = jQuery('#input_pass');
        if (!$pass.length) { return; }
        var $btn = jQuery(
            '<button type="button" class="voiz-pass-toggle" tabindex="0" ' +
            'title="نمایش/مخفی کردن رمز" aria-label="نمایش/مخفی کردن رمز">' +
            '<i class="fa fa-eye"></i></button>'
        );
        $pass.after($btn);
        $btn.on('click', function () {
            var showing = $pass.attr('type') === 'text';
            $pass.attr('type', showing ? 'password' : 'text');
            $btn.find('i').toggleClass('fa-eye fa-eye-slash');
            $pass.focus();
        });
    }

    /* ------------------------------------------------------------
       Popup hygiene: ESC closes the issabel popup box
       ------------------------------------------------------------ */
    function initPopupHygiene() {
        jQuery(document).on('keydown', function (e) {
            if (e.keyCode !== 27) { return; }
            var $box = jQuery('.neo-modal-issabel-popup-box');
            if ($box.is(':visible')) {
                var $close = $box.find('.neo-modal-issabel-popup-close');
                if ($close.length) { $close.trigger('click'); }
            }
        });
    }

    /* ------------------------------------------------------------
       Sidebar: replace neon's LTR padding animations (they fight
       the RTL layout and break the menu) with clean class toggles.
       neon-custom.js binds clicks to the GLOBAL toggle_sidebar_menu
       at ready-time but resolves it at click-time, so overriding
       the globals here is enough - no legacy file is modified.
       ------------------------------------------------------------ */
    function isDrawerMode() {
        return window.matchMedia && window.matchMedia('(max-width: 991px)').matches;
    }

    function initSidebarOverrides() {
        /* mark items with submenus ourselves (independent of neon setup) */
        jQuery('#main-menu li').each(function () {
            var $li = jQuery(this);
            if ($li.children('ul').length) { $li.addClass('has-sub'); }
        });

        if (!window.jQuery || !window.public_vars) { return; }

        window.show_sidebar_menu = function () {
            if (isDrawerMode()) { return; }
            jQuery('.page-container').removeClass('sidebar-collapsed');
        };

        window.hide_sidebar_menu = function () {
            if (isDrawerMode()) { return; }
            jQuery('.page-container').addClass('sidebar-collapsed');
            closeSidebar();
        };

        window.toggle_sidebar_menu = function () {
            if (isDrawerMode()) {
                jQuery('body').toggleClass('voiz-sidebar-open');
                return;
            }
            jQuery('.page-container').toggleClass('sidebar-collapsed');
        };

        /* tapping a real menu link closes the mobile drawer */
        jQuery(document).on('click', '#main-menu a[href*="index.php?menu="]', function () {
            if (isDrawerMode()) { closeSidebar(); }
        });

        /* fit_main_content_height() writes huge inline min-heights
           that break the fixed rail - CSS clamps them, but also make
           the legacy function a no-op for the sidebar itself. */
        if (typeof window.fit_main_content_height === 'function') {
            window.fit_main_content_height = function () { /* handled by CSS */ };
        }
    }

    jQuery(function () {
        initTheme();
        initSidebarDrawer();
        initModuleSearch();
        initLoginPasswordToggle();
        initPopupHygiene();
        initSidebarOverrides();
        initOutsideClose();
    });

    window.VoizUI = {
        applyTheme: applyTheme,
        currentTheme: currentTheme,
        toggleTheme: toggleTheme,
        closeSidebar: closeSidebar
    };
})(window.jQuery);
</script>

    $(document).ready(function() {
        $('#login-error').addClass('show');

</script>
