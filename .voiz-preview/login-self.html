/* ============================================================
   THEME TOKENS
   ============================================================ */
:root,
[data-theme="light"] {
    /* Surfaces */
    --voiz-bg:            #eceef1;   /* bone-white / grayish      */
    --voiz-bg-soft:       #f5f6f8;
    --voiz-surface:       #ffffff;
    --voiz-surface-2:     #f3f4f7;
    --voiz-surface-3:     #e9ebef;
    --voiz-border:        #d9dce2;
    --voiz-border-strong: #c3c8d0;
    --voiz-inset:         #eef0f3;

    /* Text */
    --voiz-text:          #22262c;
    --voiz-text-soft:     #565e69;
    --voiz-muted:         #878e9a;
    --voiz-heading:       #16191d;

    /* Brand / accents */
    --voiz-primary:       #c2410c;   /* dark orange             */
    --voiz-primary-hover: #ea580c;
    --voiz-primary-strong:#9a3412;
    --voiz-primary-contrast: #ffffff;
    --voiz-primary-soft:  rgba(194, 65, 12, 0.10);
    --voiz-accent:        #1e3a5f;   /* dark blue               */
    --voiz-accent-soft:   rgba(30, 58, 95, 0.09);
    --voiz-accent-text:   #16324f;

    /* Status */
    --voiz-success:       #15803d;
    --voiz-danger:        #dc2626;
    --voiz-warning:       #b45309;
    --voiz-info:          #0e7490;
    --voiz-danger-soft:   rgba(220, 38, 38, 0.10);
    --voiz-success-soft:  rgba(21, 128, 61, 0.10);
    --voiz-warning-soft:  rgba(180, 83, 9, 0.12);

    /* Sidebar */
    --voiz-sidebar-bg:        #ffffff;
    --voiz-sidebar-text:      #4b5563;
    --voiz-sidebar-text-act:  #16191d;
    --voiz-sidebar-item-hover:rgba(194, 65, 12, 0.07);
    --voiz-sidebar-active-bg: var(--voiz-primary-soft);
    --voiz-sidebar-sub-bg:    #f6f7f9;
    --voiz-sidebar-sub-text:  #59616d;
    --voiz-sidebar-border:    #e8eaee;
    --voiz-sidebar-logo-bg:   #ffffff;
    --voiz-sidebar-collapse:  #6b7280;

    /* Topbar */
    --voiz-topbar-bg:        #ffffff;
    --voiz-topbar-border:    #e6e8ec;
    --voiz-topbar-icon-bg:   #f0f1f4;
    --voiz-topbar-icon:      #454c55;
    --voiz-topbar-icon-hover:#ffffff;
    --voiz-topbar-icon-hover-bg: var(--voiz-primary);

    /* Cards / sections */
    --voiz-card-shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 4px 16px rgba(16, 24, 40, 0.04);
    --voiz-popover-shadow: 0 10px 40px rgba(16, 24, 40, 0.18);

    /* Misc */
    --voiz-radius: 10px;
    --voiz-radius-sm: 7px;
    --voiz-input-bg: #ffffff;
    --voiz-input-focused: var(--voiz-primary);
}

[data-theme="dark"] {
    /* Surfaces */
    --voiz-bg:            #101216;   /* graphite black          */
    --voiz-bg-soft:       #171a1f;
    --voiz-surface:       #1c2026;
    --voiz-surface-2:     #22272e;
    --voiz-surface-3:     #2a3038;
    --voiz-border:        #2d333c;
    --voiz-border-strong:#3c4450;
    --voiz-inset:         #15181d;

    /* Text */
    --voiz-text:          #e6e8eb;
    --voiz-text-soft:     #a8b0bb;
    --voiz-muted:         #6d7683;
    --voiz-heading:       #f2f4f6;

    /* Brand / accents */
    --voiz-primary:       #ea580c;   /* bright dark-orange      */
    --voiz-primary-hover: #f97316;
    --voiz-primary-strong:#c2410c;
    --voiz-primary-contrast: #ffffff;
    --voiz-primary-soft:  rgba(234, 88, 12, 0.16);
    --voiz-accent:        #4a84c4;   /* softened blue           */
    --voiz-accent-soft:   rgba(74, 132, 196, 0.15);
    --voiz-accent-text:   #9fc3ea;

    /* Status */
    --voiz-success:       #4ade80;
    --voiz-danger:        #f87171;
    --voiz-warning:       #fbbf24;
    --voiz-info:          #22d3ee;
    --voiz-danger-soft:   rgba(248, 113, 113, 0.14);
    --voiz-success-soft:  rgba(74, 222, 128, 0.14);
    --voiz-warning-soft:  rgba(251, 191, 36, 0.14);

    /* Sidebar */
    --voiz-sidebar-bg:         #15181d;
    --voiz-sidebar-text:       #9aa3af;
    --voiz-sidebar-text-act:   #ffffff;
    --voiz-sidebar-item-hover: rgba(255, 255, 255, 0.05);
    --voiz-sidebar-active-bg:  var(--voiz-primary-soft);
    --voiz-sidebar-sub-bg:     #1b1f25;
    --voiz-sidebar-sub-text:   #8f99a6;
    --voiz-sidebar-border:     #23272e;
    --voiz-sidebar-logo-bg:    #12151a;
    --voiz-sidebar-collapse:   #9aa3af;

    /* Topbar */
    --voiz-topbar-bg:         #171a1f;
    --voiz-topbar-border:     #242930;
    --voiz-topbar-icon-bg:    #23282f;
    --voiz-topbar-icon:       #c3cad3;
    --voiz-topbar-icon-hover: #ffffff;
    --voiz-topbar-icon-hover-bg: var(--voiz-primary);

    /* Cards / sections */
    --voiz-card-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    --voiz-popover-shadow: 0 14px 46px rgba(0, 0, 0, 0.55);

    --voiz-input-bg: #101318;
    --voiz-input-focused: var(--voiz-primary);
}

/* ============================================================
   BASE / TYPOGRAPHY / RTL
   ============================================================ */
html,
body {
    font-family: "Vazirmatn", "IRANSansWeb", iransans, Tahoma, sans-serif !important;
    direction: rtl;
    text-align: right;
}

body.page-body,
body.mainBody,
body.login-page {
    background: var(--voiz-bg) !important;
    color: var(--voiz-text) !important;
    font: 400 13px/1.7 "Vazirmatn", "IRANSansWeb", iransans, Tahoma, sans-serif !important;
}

body, #neo-contentbox, .main-content, .page-container {
    color: var(--voiz-text);
}

a {
    color: var(--voiz-accent-text);
    -webkit-transition: color .18s ease;
    transition: color .18s ease;
}
a:hover { color: var(--voiz-primary); }

h1, h2, h3, h4, h5, h6,
.moduleTitle, .module_title, .mb_title {
    color: var(--voiz-heading);
    font-family: "Vazirmatn", "IRANSansWeb", iransans, sans-serif;
}

button, input, select, textarea {
    font-family: "Vazirmatn", "IRANSansWeb", iransans, Tahoma, sans-serif !important;
}

/* ltr islands for numbers/paths */
.confdir, .ltr, input[type="tel"], .glyphicon, .fa {
    unicode-bidi: embed;
}

/* nice scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: var(--voiz-border-strong);
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--voiz-muted); background-clip: content-box; }

::selection { background: var(--voiz-primary-soft); color: var(--voiz-text); }

/* ============================================================
   LAYOUT - fix legacy fixed-width rules & overflow clipping
   ============================================================ */
#neo-headerbox, #neo-footerbox { width: auto; }

.page-container {
    background: var(--voiz-bg);
    padding-right: 280px;
    -webkit-transition: padding-right .25s ease;
    transition: padding-right .25s ease;
}
.page-container.sidebar-collapsed { padding-right: 65px; }

.page-container .main-content {
    float: none;
    display: block;
    width: 100%;
    background: transparent;
    min-width: 0;
}

#neo-contentbox {
    overflow: visible;
}
#neo-contentbox-maincolumn {
    padding: 18px 20px 26px 20px;
    margin: 0;
}
#neo-contentbox, #neo-contentbox-maincolumn, #neo-contentbox .neo-module-content {
    max-width: 100%;
}

/* kill the old content-box model that breaks modern layouts */
div.neo-module-content, div.neo-module-content *,
div.neo-module-content *::before, div.neo-module-content *::after,
#neo-contentbox, #neo-contentbox *, #neo-contentbox *::before, #neo-contentbox *::after {
    box-sizing: border-box !important;
}
div.neo-module-content {
    overflow: visible;
    background: transparent;
    color: var(--voiz-text);
}

/* module content = clean minimal card */
div.neo-module-content-frame,
div.neo-module-content {
    border-radius: var(--voiz-radius);
}
.neo-module-content, .frameModule {
    border: 1px solid var(--voiz-border);
    background: var(--voiz-surface);
    border-radius: var(--voiz-radius);
    -webkit-box-shadow: var(--voiz-card-shadow);
    box-shadow: var(--voiz-card-shadow);
    padding: 16px;
}
div.neo-module-title {
    padding: 14px 6px 10px;
}
span.neo-module-name {
    font: 600 16px/28px "Vazirmatn", sans-serif;
    color: var(--voiz-heading);
    float: none;
    display: inline-block;
}

/* footer */
footer.main {
    margin: 4px 20px 18px 20px !important;
    padding: 14px 0 0;
    color: var(--voiz-muted);
    font-size: 12px;
    border-top: 1px solid var(--voiz-border);
    text-align: center;
}
footer.main a { color: var(--voiz-muted) !important; }
footer.main a:hover { color: var(--voiz-primary) !important; }

/* ============================================================
   SIDEBAR  (right-side navigation)
   ============================================================ */
.page-container .sidebar-menu {
    background: var(--voiz-sidebar-bg);
    border-left: 1px solid var(--voiz-border);
    color: var(--voiz-sidebar-text);
    width: 280px;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-transition: width .25s ease, transform .25s ease;
    transition: width .25s ease, transform .25s ease;
    z-index: 90;
}

.page-container .sidebar-menu .logo-env {
    background: var(--voiz-sidebar-logo-bg);
    height: 66px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--voiz-sidebar-border);
}
.page-container .sidebar-menu .logo-env > div.logo a {
    display: flex;
    align-items: center;
}
.page-container .sidebar-menu .logo-env > div.logo img {
    width: 38px;
    height: auto;
}
.page-container .sidebar-menu .logo-env > div.sidebar-collapse a,
.page-container .sidebar-menu .logo-env > div.sidebar-mobile-menu a {
    border: 1px solid var(--voiz-sidebar-border);
    color: var(--voiz-sidebar-collapse);
    -webkit-border-radius: 8px;
    border-radius: 8px;
    padding: 3px 6px;
    background: transparent;
}
.page-container .sidebar-menu .logo-env > div.sidebar-collapse a:hover,
.page-container .sidebar-menu .logo-env > div.sidebar-mobile-menu a:hover {
    background: var(--voiz-sidebar-item-hover);
    color: var(--voiz-primary);
}

/* main menu */
.page-container .sidebar-menu #main-menu {
    padding: 10px 10px 20px;
    margin: 0;
}
.page-container .sidebar-menu #main-menu > li {
    border-bottom: none;
    margin: 2px 0;
}
.page-container .sidebar-menu #main-menu > li > a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 9px;
    color: var(--voiz-sidebar-text);
    font-size: 13.5px;
    font-weight: 400;
    transition: background-color .15s ease, color .15s ease;
}
.page-container .sidebar-menu #main-menu > li > a:hover {
    background: var(--voiz-sidebar-item-hover);
    color: var(--voiz-sidebar-text-act);
}
.page-container .sidebar-menu #main-menu li > a i {
    width: 20px;
    text-align: center;
    font-size: 15px;
    margin: 0;
    color: var(--voiz-muted);
    transition: color .15s ease;
}
.page-container .sidebar-menu #main-menu li > a:hover i,
.page-container .sidebar-menu #main-menu li.active > a i {
    color: var(--voiz-primary);
}
.page-container .sidebar-menu #main-menu li a span {
    font-size: 13.5px;
    flex: 1;
}

/* current menu */
.page-container .sidebar-menu #main-menu li.active > a {
    background: var(--voiz-sidebar-active-bg);
    color: var(--voiz-sidebar-text-act);
    font-weight: 600;
    /* accent bar on the menu edge */
    box-shadow: inset 3px 0 0 0 var(--voiz-primary);
}

/* expand arrow - fa chevron, rotated when open */
.page-container .sidebar-menu #main-menu li.has-sub > a:before {
    font-family: "FontAwesome";
    content: "\f104";
    font-size: 12px;
    color: var(--voiz-muted);
    float: none;
    margin: 0;
    order: 3;
    -webkit-transition: transform .2s ease;
    transition: transform .2s ease;
    position: static;
}
.page-container .sidebar-menu #main-menu li.has-sub.opened > a:before {
    -webkit-transform: rotate(-90deg);
    transform: rotate(-90deg);
}

/* submenu */
.page-container .sidebar-menu #main-menu li ul {
    background: transparent;
    border: none;
    border-right: 1px solid var(--voiz-border);
    margin: 2px 18px 4px 8px;
    overflow: hidden;
}
.page-container .sidebar-menu #main-menu li ul.visible { display: block; }
.page-container .sidebar-menu #main-menu li ul > li {
    border: none;
}
.page-container .sidebar-menu #main-menu li ul > li > a {
    background: transparent;
    color: var(--voiz-sidebar-sub-text);
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 12.5px;
}
.page-container .sidebar-menu #main-menu li ul > li > a:hover {
    background: var(--voiz-sidebar-item-hover);
    color: var(--voiz-sidebar-text-act);
}
.page-container .sidebar-menu #main-menu li ul > li.active > a {
    background: var(--voiz-sidebar-active-bg);
    color: var(--voiz-primary);
    font-weight: 600;
}
.page-container .sidebar-menu #main-menu li ul > li ul > li > a,
.page-container .sidebar-menu #main-menu li ul > li ul > li ul > li > a,
.page-container .sidebar-menu #main-menu li ul > li ul > li ul > li ul > li > a {
    background: transparent;
    padding: 6px 12px;
}

/* collapsed sidebar */
.page-container.sidebar-collapsed {
    padding-right: 65px;
}
.page-container.sidebar-collapsed .sidebar-menu {
    width: 65px;
}
.page-container.sidebar-collapsed .sidebar-menu .logo-env { padding: 14px 10px; }
.page-container.sidebar-collapsed .sidebar-menu .logo-env > div.logo { display: none; }
.page-container.sidebar-collapsed .sidebar-menu #main-menu { padding: 10px 8px; }
.page-container.sidebar-collapsed .sidebar-menu #main-menu > li > a {
    justify-content: center;
    padding: 10px 0;
}
.page-container.sidebar-collapsed .sidebar-menu #main-menu > li > a span:not(.badge),
.page-container.sidebar-collapsed .sidebar-menu #main-menu li.has-sub > a:before {
    display: none;
}
.page-container.sidebar-collapsed .sidebar-menu #main-menu > li > a i { margin: 0; }
.page-container.sidebar-collapsed .sidebar-menu #main-menu > li > ul {
    display: none;
}
.page-container.sidebar-collapsed .sidebar-menu #main-menu > li:hover > ul,
.page-container.sidebar-collapsed.sidebar-is-showing .sidebar-menu #main-menu > li > ul {
    display: block;
    position: absolute;
    right: 65px;
    top: 0;
    width: 240px;
    height: auto;
    visibility: visible;
    opacity: 1;
    background: var(--voiz-sidebar-sub-bg);
    border: 1px solid var(--voiz-border);
    border-radius: 0 10px 10px 0;
}
.page-container.sidebar-collapsed .sidebar-menu #main-menu > li:hover > a > span:not(.badge) {
    display: block;
    position: absolute;
    right: 65px;
    top: 0;
    width: 240px;
    padding: 11px 14px;
    height: auto;
    visibility: visible;
    opacity: 1;
    background: var(--voiz-topbar-icon-hover-bg);
    color: var(--voiz-topbar-icon-hover);
    border-radius: 0 10px 10px 0;
    box-shadow: var(--voiz-popover-shadow);
    z-index: 5;
}

/* remove search from the collapsed flyout (search now lives in topbar) */
.page-container .sidebar-menu #main-menu li#search { display: none; }

/* ============================================================
   TOPBAR  (logo / search / actions / user)
   ============================================================ */
.voiz-topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 66px;
    padding: 0 18px;
    background: var(--voiz-topbar-bg);
    border-bottom: 1px solid var(--voiz-topbar-border);
    position: relative;
    z-index: 5;
}

.voiz-topbar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
}
.voiz-topbar-logo img { height: 40px; width: auto; }
.voiz-topbar-logo kbd {
    background: var(--voiz-primary-soft);
    color: var(--voiz-primary);
    font-size: 11px;
    border-radius: 6px;
    padding: 2px 8px;
    border: 1px solid transparent;
    font-family: "Vazirmatn", sans-serif;
}
.voiz-topbar-sep {
    width: 1px;
    align-self: stretch;
    background: var(--voiz-topbar-border);
    margin: 10px 2px;
}

/* search - separated from sidebar (#5) */
.voiz-topbar-search {
    flex: 1;
    max-width: 460px;
    min-width: 120px;
    position: relative;
}
.voiz-topbar-search form {
    position: relative;
    margin: 0;
}
.voiz-topbar-search .voiz-search-icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--voiz-muted);
    font-size: 14px;
    pointer-events: none;
}
.voiz-topbar-search input[type="text"] {
    width: 100%;
    height: 36px;
    border-radius: 20px;
    border: 1px solid var(--voiz-border);
    background: var(--voiz-inset);
    color: var(--voiz-text);
    padding: 0 34px 0 14px;
    outline: none;
    font-size: 12.5px;
    transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
}
.voiz-topbar-search input[type="text"]:focus {
    border-color: var(--voiz-primary);
    background: var(--voiz-input-bg);
    box-shadow: 0 0 0 3px var(--voiz-primary-soft);
}
.voiz-topbar-search input[type="text"]::placeholder { color: var(--voiz-muted); }
.voiz-topbar-search input[type="submit"],
.voiz-topbar-search button {
    display: none;
}

/* actions (icons) */
.voiz-topbar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
}
.voiz-topbar-actions > li { display: inline-block; margin: 0; position: relative; }
.voiz-topbar-actions > li > a {
    display: flex !important;
    align-items: center;
    justify-content: center;
    width: 36px !important;
    height: 36px !important;
    border-radius: 50% !important;
    background: var(--voiz-topbar-icon-bg) !important;
    border: 1px solid transparent !important;
    color: var(--voiz-topbar-icon) !important;
    font-size: 15px !important;
    padding: 0 !important;
    transition: all .18s ease;
}
.voiz-topbar-actions > li > a:hover {
    background: var(--voiz-topbar-icon-hover-bg) !important;
    color: var(--voiz-topbar-icon-hover) !important;
    border-color: var(--voiz-topbar-icon-hover-bg) !important;
    transform: translateY(-1px);
}

/* user chip */
.voiz-topbar-user {
    display: flex;
    align-items: center;
    position: relative;
}
.voiz-topbar-user > a.voiz-user-link {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    padding: 4px 8px 4px 4px;
    border-radius: 22px;
    transition: background .15s ease;
}
.voiz-topbar-user > a.voiz-user-link:hover { background: var(--voiz-surface-2); }
.voiz-topbar-user img {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid var(--voiz-primary-soft);
    object-fit: cover;
}
.voiz-topbar-user .voiz-user-name {
    color: var(--voiz-text);
    font-size: 12.5px;
    font-weight: 600;
    max-width: 130px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.voiz-topbar-user .voiz-user-caret { color: var(--voiz-muted); font-size: 12px; }

/* topbar dropdowns */
.voiz-topbar-actions .dropdown-menu,
.voiz-topbar-user .dropdown-menu {
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius-sm);
    box-shadow: var(--voiz-popover-shadow);
    padding: 6px;
    margin-top: 8px;
    min-width: 190px;
    right: 0;
    left: auto;
    max-height: calc(100vh - 90px);
    overflow-y: auto;
}
.voiz-topbar-actions .dropdown-menu .caret { display: none; }
.voiz-topbar-actions .dropdown-menu > li > a,
.voiz-topbar-user .dropdown-menu > li > a {
    color: var(--voiz-text-soft);
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 6px;
    text-align: right;
    direction: rtl;
    display: flex;
    align-items: center;
    gap: 8px;
    -webkit-transition: all .12s ease;
    transition: all .12s ease;
}
.voiz-topbar-actions .dropdown-menu > li > a i,
.voiz-topbar-user .dropdown-menu > li > a i { width: 16px; text-align: center; color: var(--voiz-muted); }
.voiz-topbar-actions .dropdown-menu > li > a:hover,
.voiz-topbar-user .dropdown-menu > li > a:hover {
    background: var(--voiz-primary-soft);
    color: var(--voiz-primary);
}
.voiz-topbar-actions .dropdown-menu > li > a:hover i,
.voiz-topbar-user .dropdown-menu > li > a:hover i { color: var(--voiz-primary); }

/* notifications list inside bell dropdown */
.voiz-topbar-actions .dropdown-menu li .notification-list,
.voiz-topbar-actions .dropdown-menu li ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 260px;
    overflow-y: auto;
}
.voiz-topbar-actions .dropdown-menu li ul li { border-bottom: 1px solid var(--voiz-border); }
.voiz-topbar-actions .dropdown-menu li ul li:last-child { border-bottom: 0; }
.voiz-topbar-actions .dropdown-menu li p {
    color: var(--voiz-muted);
    font-size: 11px;
    padding: 8px 4px;
    margin: 0;
    text-align: right;
}
.voiz-topbar-actions .dropdown-menu li ul li a {
    color: var(--voiz-text-soft);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 6px;
    display: block;
}
.voiz-topbar-actions .dropdown-menu li ul li a:hover { background: var(--voiz-surface-2); color: var(--voiz-text); }
.voiz-topbar-actions .dropdown-menu li ul li.notification-info a i   { color: var(--voiz-info); }
.voiz-topbar-actions .dropdown-menu li ul li.notification-warning a i{ color: var(--voiz-warning); }
.voiz-topbar-actions .dropdown-menu li ul li.notification-danger a i { color: var(--voiz-danger); }

/* badge on bell */
.voiz-topbar-actions .neo-topbar-notification-badge {
    position: absolute;
    top: -2px;
    left: -2px;
    right: auto;
    background: var(--voiz-danger);
    font-size: 9px;
    padding: 2px 5px;
    border-radius: 10px;
}

/* mobile burger + theme toggle in topbar */
a.voiz-topbar-burger {
    display: none;
    align-items: center;
    justify-content: center;
    width: 36px !important;
    height: 36px !important;
    border-radius: 50%;
    background: var(--voiz-topbar-icon-bg);
    border: 1px solid transparent;
    color: var(--voiz-topbar-icon);
    font-size: 15px;
    text-decoration: none;
    padding: 0;
    -webkit-transition: all .18s ease;
    transition: all .18s ease;
}
a.voiz-topbar-burger:hover {
    background: var(--voiz-topbar-icon-hover-bg);
    color: var(--voiz-topbar-icon-hover);
    border-color: var(--voiz-topbar-icon-hover-bg);
    transform: translateY(-1px);
}
a.voiz-theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px !important;
    height: 34px !important;
    border-radius: 50%;
    background: var(--voiz-topbar-icon-bg);
    border: 1px solid transparent;
    color: var(--voiz-topbar-icon);
    font-size: 14px;
    text-decoration: none;
    padding: 0;
    flex: 0 0 auto;
    -webkit-transition: all .18s ease;
    transition: all .18s ease;
}
a.voiz-theme-toggle:hover {
    background: var(--voiz-primary);
    border-color: var(--voiz-primary);
    color: #fff;
    transform: rotate(20deg);
}
@media (max-width: 991px) {
    a.voiz-topbar-burger { display: inline-flex; }
}

/* ============================================================
   BREADCRUMB
   ============================================================ */
.breadcrumb {
    background: transparent;
    border-radius: 0;
    margin: 0;
    padding: 12px 24px;
    border-bottom: 1px solid var(--voiz-border);
    font-size: 12.5px;
    direction: rtl;
    text-align: right;
}
.breadcrumb > li { color: var(--voiz-muted); }
.breadcrumb > li a { color: var(--voiz-text-soft); text-decoration: none; }
.breadcrumb > li a:hover { color: var(--voiz-primary); }
.breadcrumb > .active { color: var(--voiz-heading); font-weight: 600; }
.breadcrumb > .active strong { font-weight: 600; }
.breadcrumb > li + li::before {
    content: "/";
    color: var(--voiz-border-strong);
    padding: 0 6px;
    direction: ltr;
}

/* ============================================================
   FORMS  (#3)
   ============================================================ */
input[type="text"],
input[type="password"],
input[type="email"],
input[type="number"],
input[type="tel"],
input[type="search"],
input[type="date"],
input[type="datetime-local"],
input[type="time"],
select,
textarea {
    height: 34px;
    min-height: 34px;
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius-sm);
    background: var(--voiz-input-bg);
    color: var(--voiz-text);
    padding: 0 10px;
    font-size: 12.5px !important;
    line-height: 1.4;
    outline: none;
    -webkit-transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    box-sizing: border-box;
    vertical-align: middle;
}
select {
    padding-left: 26px;
    background-image: linear-gradient(45deg, transparent 50%, var(--voiz-muted) 50%),
                      linear-gradient(135deg, var(--voiz-muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
}
select[multiple], select[size] { background-image: none; padding: 4px; height: auto; }
textarea {
    height: auto;
    min-height: 72px;
    padding: 9px 10px;
    resize: vertical;
}
input[type="text"]:focus,
input[type="password"]:focus,
input[type="email"]:focus,
input[type="number"]:focus,
input[type="tel"]:focus,
input[type="search"]:focus,
input[type="date"]:focus,
input[type="datetime-local"]:focus,
input[type="time"]:focus,
select:focus,
textarea:focus {
    border-color: var(--voiz-input-focused);
    background: var(--voiz-surface);
    box-shadow: 0 0 0 3px var(--voiz-primary-soft);
}
input[disabled], select[disabled], textarea[disabled],
input[readonly], select[readonly], textarea[readonly] {
    background: var(--voiz-surface-2);
    color: var(--voiz-muted);
    cursor: not-allowed;
    opacity: .8;
}
input[type="checkbox"], input[type="radio"] {
    width: 15px;
    height: 15px;
    accent-color: var(--voiz-primary);
    cursor: pointer;
    vertical-align: middle;
    margin: 0 3px 2px 0;
}
input[type="file"] { width: auto; max-width: 100%; border: none; background: transparent; }
label {
    color: var(--voiz-text-soft);
    font-size: 12.5px;
    font-weight: 500;
}
.required { color: var(--voiz-danger); }

/* generic field wrapper used by many VOIZ forms */
.field, .voiz-field { margin-bottom: 12px; }
.fila_botonera, .fila_pie { text-align: center; }

/* ============================================================
   BUTTONS  (#3 / #8)
   ============================================================ */
.button,
input.button,
input[type="submit"],
input[type="button"],
input[type="reset"],
button,
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 34px;
    padding: 0 16px;
    border-radius: var(--voiz-radius-sm);
    border: 1px solid var(--voiz-border);
    background: var(--voiz-surface);
    color: var(--voiz-text-soft);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    -webkit-transition: all .15s ease;
    transition: all .15s ease;
    box-shadow: none;
    white-space: nowrap;
}
.button:hover, input[type="submit"]:hover, button:hover, .btn:hover {
    border-color: var(--voiz-border-strong);
    background: var(--voiz-surface-2);
    color: var(--voiz-text);
}

/* primary "save/submit" default */
input[type="submit"],
button[type="submit"] {
    background: var(--voiz-primary);
    border-color: var(--voiz-primary);
    color: var(--voiz-primary-contrast);
    font-weight: 600;
}
input[type="submit"]:hover, button[type="submit"]:hover {
    background: var(--voiz-primary-hover);
    border-color: var(--voiz-primary-hover);
    color: #fff;
}
input[type="submit"]:active, button[type="submit"]:active {
    background: var(--voiz-primary-strong);
    border-color: var(--voiz-primary-strong);
}

.btn-primary {
    background: var(--voiz-primary);
    border-color: var(--voiz-primary);
    color: var(--voiz-primary-contrast);
}
.btn-primary:hover, .btn-primary:focus {
    background: var(--voiz-primary-hover) !important;
    border-color: var(--voiz-primary-hover) !important;
    color: #fff !important;
}
.btn-default {
    background: var(--voiz-surface);
    border-color: var(--voiz-border);
    color: var(--voiz-text-soft);
}
.btn-success { background: var(--voiz-success); border-color: var(--voiz-success); }
.btn-danger  { background: var(--voiz-danger); border-color: var(--voiz-danger); }
.btn-warning { background: var(--voiz-warning); border-color: var(--voiz-warning); }
.btn-info    { background: var(--voiz-info); border-color: var(--voiz-info); }

/* list-grid toolbar buttons (issabel standard grid) */
.neo-table-toolbar-button,
.neo-table-action,
input.neo-table-action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--voiz-border);
    background: var(--voiz-surface);
    color: var(--voiz-text-soft);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    vertical-align: middle;
    -webkit-transition: all .15s ease;
    transition: all .15s ease;
}
.neo-table-toolbar-button:hover, .neo-table-action:hover {
    border-color: var(--voiz-primary);
    background: var(--voiz-primary-soft);
    color: var(--voiz-primary);
}
.neo-table-toolbar-button i, .neo-table-action i { color: inherit; }

.neo-table-header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius);
    background: var(--voiz-surface);
    margin-bottom: 14px;
    box-shadow: var(--voiz-card-shadow);
}
.neo-table-header-row-filter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0;
}
.neo-table-button-filter-left,
.neo-table-button-filter-right {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px !important;
    padding: 0 12px !important;
    border-radius: 8px !important;
    border: 1px solid var(--voiz-border);
    background: var(--voiz-surface);
    color: var(--voiz-text-soft);
    font-size: 12px !important;
    cursor: pointer;
    -webkit-transition: all .15s ease;
    transition: all .15s ease;
}
.neo-table-button-filter-left:hover, .neo-table-button-filter-right:hover {
    border-color: var(--voiz-primary);
    color: var(--voiz-primary);
    background: var(--voiz-primary-soft);
}

/* filter row inside list grids */
#neo-table-header-filterrow {
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius);
    background: var(--voiz-surface-2);
    padding: 14px 16px;
    margin-bottom: 14px;
}
#neo-table-header-filterrow form,
#neo-table-header-filterrow table,
#neo-table-header-filterrow .filterForm {
    background: transparent !important;
    margin: 0;
}
.neo-table-filter-controls {
    padding: 6px 2px 12px;
}
.neo-filter-control {
    display: inline-block;
    background: var(--voiz-primary-soft);
    color: var(--voiz-primary);
    border-radius: 16px;
    padding: 3px 12px;
    margin: 3px 0 3px 6px;
    font-size: 11.5px;
}
.neo-filter-control i { font-style: normal; }
.neo-filter-control a { margin-right: 6px; color: var(--voiz-primary) !important; }

/* navigation */
.neo-table-header-row-navigation,
.neo-table-footer-row .neo-table-header-row-navigation {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--voiz-muted);
    font-size: 12px;
}
.neo-navigation-arrow-active {
    color: var(--voiz-accent-text) !important;
    text-decoration: none;
    font-size: 14px;
}
.neo-navigation-arrow-active:hover { color: var(--voiz-primary) !important; }

/* ============================================================
   TABLES  (#4)
   ============================================================ */
.voiz-table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius);
    background: var(--voiz-surface);
    box-shadow: var(--voiz-card-shadow);
}

table.issabel-standard-table {
    width: 100% !important;
    border-collapse: separate;
    border-spacing: 0;
    margin: 0;
    background: var(--voiz-surface);
}
table.issabel-standard-table thead th {
    background: var(--voiz-surface-2);
    color: var(--voiz-heading);
    font-size: 12px;
    font-weight: 700;
    text-align: right;
    padding: 11px 14px;
    border-bottom: 2px solid var(--voiz-border);
    white-space: nowrap;
}
table.issabel-standard-table tbody td,
table.issabel-standard-table td.table_data {
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--voiz-text-soft);
    border-bottom: 1px solid var(--voiz-border);
    text-align: right;
}
table.issabel-standard-table tbody tr:last-child td { border-bottom: 0; }
table.issabel-standard-table tbody tr:hover td {
    background: var(--voiz-surface-2);
}
table.issabel-standard-table tfoot th {
    background: var(--voiz-surface-2);
    border-top: 2px solid var(--voiz-border);
    padding: 9px 14px;
    font-size: 12px;
    color: var(--voiz-heading);
}

/* legacy table styles still used by modules */
table.tabla_listado {
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius);
    background: var(--voiz-surface);
    border-spacing: 0;
    width: 100%;
}
table.tabla_listado tr.primera_fila td {
    background: var(--voiz-surface-2) !important;
    color: var(--voiz-heading);
    font-size: 12px;
    font-weight: 700;
    border-bottom: 2px solid var(--voiz-border);
    padding: 10px 12px;
}
table.tabla_listado tr.fila_listado td,
table.tabla_listado td.table_data {
    padding: 9px 12px;
    font-size: 12px;
    color: var(--voiz-text-soft);
    border-bottom: 1px solid var(--voiz-border);
}
table.tabla_listado tr.fila_listado:hover td,
table.tabla_listado tr:hover > td.table_data {
    background: var(--voiz-surface-2);
}
table.tabla_listado .fila_subtotal td {
    background: var(--voiz-surface-2);
    font-weight: 600;
    color: var(--voiz-heading);
}
table.tabla_listado tr.fila_paginacion td {
    background: var(--voiz-surface-2);
    color: var(--voiz-muted);
    padding: 8px 12px;
}

/* config-like header tables */
table.tabla_cabecera {
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius);
    background: var(--voiz-surface-2);
    padding: 12px 16px;
    font-size: 12px;
}
table.tabla_cabecera * { color: var(--voiz-text-soft); }

/* form tables */
table.tabForm {
    font-size: 13px !important;
    border-spacing: 0;
    width: 100% !important;
    max-width: 100%;
    color: var(--voiz-text-soft);
}
table.tabForm td {
    padding: 7px 8px;
    font-size: 12.5px;
    vertical-align: middle;
    color: var(--voiz-text-soft);
    border: none;
}
table.tabForm td b { color: var(--voiz-text); font-weight: 600; }
table.tabForm tr.letra12 td { color: var(--voiz-text-soft); font-size: 12.5px; }

tr.primera_fila td, tr.fila_listado td, tr.fila_listado {
    font-size: 12px;
}
tr.fila_listado td { padding: 6px 8px; }

/* ============================================================
   SECTIONS / BOXES  (#8)
   ============================================================ */
.filterForm, form.filterForm, form.issabel-standard-formgrid {
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius);
    padding: 14px 16px;
    box-shadow: var(--voiz-card-shadow);
}

.neo-addons-header-row,
.neo-addons-row {
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius);
    padding: 12px 16px;
    margin-bottom: 12px;
    box-shadow: var(--voiz-card-shadow);
}

/* generic neon panels */
.panel {
    background: var(--voiz-surface);
    border-color: var(--voiz-border);
    border-radius: var(--voiz-radius);
    box-shadow: var(--voiz-card-shadow);
}
.panel .panel-heading {
    background: var(--voiz-surface-2);
    border-bottom: 1px solid var(--voiz-border);
    color: var(--voiz-heading);
    border-radius: var(--voiz-radius) var(--voiz-radius) 0 0;
}
.panel .panel-body { color: var(--voiz-text-soft); }
.panel-default, .panel-invert, .panel-neon {
    border-color: var(--voiz-border);
}
.panel-invert > .panel-heading,
.panel-neon > .panel-heading {
    background: var(--voiz-accent);
    color: #fff;
    border-color: transparent;
}
.panel-invert > .panel-body { background: var(--voiz-surface); }

/* alert / messages */
.alert {
    border-radius: var(--voiz-radius-sm);
    background: var(--voiz-surface-2);
    border-color: var(--voiz-border);
    color: var(--voiz-text-soft);
}
.alert-success { background: var(--voiz-success-soft); border-color: var(--voiz-success); color: var(--voiz-success); }
.alert-danger, .alert-error { background: var(--voiz-danger-soft); border-color: var(--voiz-danger); color: var(--voiz-danger); }
.alert-warning { background: var(--voiz-warning-soft); border-color: var(--voiz-warning); color: var(--voiz-warning); }
.alert-info { background: var(--voiz-accent-soft); border-color: var(--voiz-info); color: var(--voiz-info); }

/* ============================================================
   PAGINATION
   ============================================================ */
.pagination > li > a,
.pagination > li > span {
    background: var(--voiz-surface);
    border-color: var(--voiz-border);
    color: var(--voiz-text-soft);
    border-radius: 6px !important;
    margin: 0 2px;
}
.pagination > li > a:hover { background: var(--voiz-surface-2); color: var(--voiz-primary); }
.pagination > .active > a,
.pagination > .active > span,
.pagination > .active > a:hover {
    background: var(--voiz-primary) !important;
    border-color: var(--voiz-primary) !important;
    color: #fff !important;
}

/* ============================================================
   DROPDOWNS / MENUS
   ============================================================ */
.dropdown-menu {
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius-sm);
    box-shadow: var(--voiz-popover-shadow);
    padding: 6px;
}
.dropdown-menu .caret { display: none; }
.dropdown-menu > li > a {
    color: var(--voiz-text-soft);
    font-size: 12.5px;
    padding: 8px 12px;
    border-radius: 6px;
    text-align: right;
    direction: rtl;
    display: flex;
    align-items: center;
    gap: 8px;
}
.dropdown-menu > li > a i { width: 16px; text-align: center; color: var(--voiz-muted); }
.dropdown-menu > li > a:hover,
.dropdown-menu > li > a:focus {
    background: var(--voiz-primary-soft);
    color: var(--voiz-primary);
}
.dropdown-menu > li > a:hover i { color: var(--voiz-primary); }
.dropdown-menu .dropdown-header { color: var(--voiz-muted); font-size: 11px; }
.open > .dropdown-menu { animation: voiz-fade .14s ease; }
@keyframes voiz-fade {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: none; }
}

/* ============================================================
   POPUPS / MODALS  (#11 #12)
   ============================================================ */

/* --- internal issabel popup (ShowModalPopUP) --- */
.neo-modal-issabel-popup-blockmask {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.45) !important;
    z-index: 10550;
}
.neo-modal-issabel-popup-box {
    position: fixed !important;
    top: 50% !important;
    left: 50% !important;
    right: auto !important;
    width: min(560px, calc(100vw - 32px)) !important;
    max-height: calc(100vh - 60px);
    overflow-y: auto;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    background: var(--voiz-surface) !important;
    border: 1px solid var(--voiz-border);
    border-radius: 14px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
    padding: 22px 24px !important;
    z-index: 10600;
}
.neo-modal-issabel-popup-title {
    position: static;
    font: 600 15px "Vazirmatn", sans-serif;
    color: var(--voiz-heading);
    padding: 0 0 12px;
    text-align: right;
    border-bottom: 1px solid var(--voiz-border);
    margin-bottom: 14px;
    width: 100%;
}
.neo-modal-issabel-popup-content {
    position: static;
    color: var(--voiz-text-soft);
    font-size: 12.5px;
}
.neo-modal-issabel-popup-close {
    position: absolute;
    top: 14px;
    left: 16px;
    right: auto;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--voiz-surface-2);
    cursor: pointer;
}
.neo-modal-issabel-popup-close:before,
.neo-modal-issabel-popup-close:after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 13px;
    height: 1.5px;
    background: var(--voiz-text-soft);
}
.neo-modal-issabel-popup-close:before { transform: translate(-50%, -50%) rotate(45deg); }
.neo-modal-issabel-popup-close:after  { transform: translate(-50%, -50%) rotate(-45deg); }
.neo-modal-issabel-popup-close:hover { background: var(--voiz-danger-soft); }

/* --- bootstrap modals --- */
.modal { z-index: 20000; }
.modal-backdrop { background: rgba(10, 12, 16, .5); }
.modal-content {
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: 14px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
}
.modal-header {
    background: var(--voiz-surface-2);
    border-bottom: 1px solid var(--voiz-border);
    border-radius: 13px 13px 0 0;
    padding: 14px 18px;
}
.modal-title { color: var(--voiz-heading); font-size: 15px; font-weight: 700; }
.modal-header .close {
    color: var(--voiz-text-soft);
    opacity: .7;
    text-shadow: none;
    font-size: 22px;
}
.modal-body {
    background: var(--voiz-surface);
    color: var(--voiz-text-soft);
    font-size: 12.5px;
    max-height: calc(100vh - 220px);
    overflow-y: auto;
}
.modal-footer {
    border-top: 1px solid var(--voiz-border);
    background: var(--voiz-surface-2);
    border-radius: 0 0 13px 13px;
}

/* --- swal2 (used by webphone/panels if injected) --- */
.swal2-popup {
    background: var(--voiz-surface) !important;
    color: var(--voiz-text) !important;
    border-radius: 16px !important;
    font-family: "Vazirmatn", sans-serif !important;
}
.swal2-title, .swal2-content { color: var(--voiz-heading) !important; }

/* --- jquery-ui dialog (used by some modules) --- */
.ui-dialog {
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: 12px;
    box-shadow: var(--voiz-popover-shadow);
    padding: 0;
}
.ui-dialog .ui-dialog-titlebar {
    background: var(--voiz-surface-2);
    border: none;
    border-bottom: 1px solid var(--voiz-border);
    border-radius: 11px 11px 0 0;
    color: var(--voiz-heading);
    padding: 9px 14px;
}
.ui-dialog .ui-dialog-content { color: var(--voiz-text-soft); font-size: 12.5px; }
.ui-dialog .ui-dialog-buttonpane {
    border-top: 1px solid var(--voiz-border);
    background: var(--voiz-surface-2);
}
.ui-widget-overlay { background: rgba(10, 12, 16, .5); }

/* --- inline/server message bar (mb_message) --- */
div.div_msg_errors {
    background: var(--voiz-warning-soft) !important;
    border: 1px solid var(--voiz-warning) !important;
    color: var(--voiz-warning) !important;
    border-radius: var(--voiz-radius-sm);
    margin: 14px auto;
    padding: 8px 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    max-width: 900px;
}
div.div_msg_errors > div { padding: 4px; }
div.div_msg_errors_title { float: none; width: auto; font-weight: 700; color: var(--voiz-warning); }
div.div_msg_errors_title b { color: var(--voiz-warning); font-weight: 700; }
div.div_msg_errors_content { margin: 0; flex: 1; color: var(--voiz-text-soft); font-size: 12.5px; }
div.div_msg_errors_dismiss { float: none; width: auto; order: 3; }
div.div_msg_errors_dismiss i {
    cursor: pointer;
    color: var(--voiz-muted);
    font-size: 14px;
    padding: 3px;
    border-radius: 50%;
}
div.div_msg_errors_dismiss i:hover { color: var(--voiz-danger); }

/* sticky note popup */
#neo-sticky-note { z-index: 15000; }
#neo-sticky-note, .sticky-note-dialog {
    background: var(--voiz-surface);
    color: var(--voiz-text-soft);
    border-radius: 12px;
    box-shadow: var(--voiz-popover-shadow);
    border: 1px solid var(--voiz-border);
    font-family: "Vazirmatn", sans-serif;
}

/* ============================================================
   SIDEBAR PANELS (#chat)
   ============================================================ */
#chat {
    background: var(--voiz-bg-soft);
    border-right: 1px solid var(--voiz-border);
}
#chat .chat-header {
    color: var(--voiz-heading);
    border-bottom: 1px solid var(--voiz-border);
}
#chat .chat-inner > .panel-group > .panel > .panel-heading {
    border-bottom: 1px solid var(--voiz-border);
}
#chat .chat-inner > .panel-group > .panel > .panel-heading a { color: var(--voiz-text-soft); }
#chat .chat-inner > .panel-group > .panel > .panel-heading:hover { background: var(--voiz-surface-2); }
#chat .chat-inner > .panel-group > .panel > .panel-heading:hover a { color: var(--voiz-text); }
#chat .chat-inner > .panel-group > .panel .panel-body { color: var(--voiz-text-soft); }
#chat .chat-close { color: var(--voiz-muted); }

/* ============================================================
   DATE / TIME PICKERS, CHOSEN, POPOVERS, TOOLTIPS
   ============================================================ */
.datepicker.dropdown-menu, .bootstrap-datetimepicker-widget,
.timepicker.dropdown-menu {
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: 10px;
    color: var(--voiz-text);
    box-shadow: var(--voiz-popover-shadow);
    direction: rtl;
}
.datepicker table tr td.day, .datepicker table tr td span { color: var(--voiz-text-soft); }
.datepicker table tr td.active, .datepicker table tr td.active:hover { background: var(--voiz-primary) !important; }
.datepicker table tr td.old, .datepicker table tr td.new { color: var(--voiz-muted); }
.datepicker thead tr th { color: var(--voiz-muted); }

.chosen-container .chosen-single,
.chosen-container-multi .chosen-choices {
    background: var(--voiz-input-bg);
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius-sm);
    color: var(--voiz-text);
    height: 34px;
    line-height: 32px;
    box-shadow: none;
}
.chosen-container-active .chosen-single,
.chosen-container-active .chosen-choices {
    border-color: var(--voiz-primary);
    box-shadow: 0 0 0 3px var(--voiz-primary-soft);
}
.chosen-container .chosen-drop {
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: 0 0 8px 8px;
    box-shadow: var(--voiz-popover-shadow);
}
.chosen-container .chosen-results li { color: var(--voiz-text-soft); }
.chosen-container .chosen-results li.highlighted {
    background: var(--voiz-primary-soft);
    color: var(--voiz-primary);
}

.popover {
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-radius: 10px;
    box-shadow: var(--voiz-popover-shadow);
    color: var(--voiz-text-soft);
    max-width: 320px;
}
.popover-title {
    background: var(--voiz-surface-2);
    color: var(--voiz-heading);
    border-bottom: 1px solid var(--voiz-border);
    border-radius: 9px 9px 0 0;
}
.tooltip .tooltip-inner {
    background: var(--voiz-heading);
    color: var(--voiz-surface);
    border-radius: 6px;
    font-size: 11px;
}
.tooltip.top .tooltip-arrow { border-top-color: var(--voiz-heading); }

/* ============================================================
   MISC UI FIXES  (#13)
   ============================================================ */
/* focus ring everywhere */
:focus-visible {
    outline: 2px solid var(--voiz-primary);
    outline-offset: 1px;
}
/* fa icons baseline */
.fa, .entypo-* { line-height: 1; }

/* hide the old "menu logo" & "3rd level" style leftovers */
.neo-module-name-left, .neo-module-name-right, .neo-module-title-buttonstab-left,
.neo-module-title-buttonstab-right { display: none; }

/* remove hard purple leftovers from purple.css */
body .page-container .sidebar-menu #main-menu li ul > li > a,
body .page-container .sidebar-menu #main-menu li ul li ul li a {
    color: var(--voiz-sidebar-sub-text);
}
body .page-container .sidebar-menu #main-menu li.opened i,
body .page-container .sidebar-menu #main-menu ul li.opened > a:hover i { color: var(--voiz-primary); }
body .page-container .sidebar-menu #main-menu li:hover { background: transparent; }

/* login page also inherits tokens (see login.tpl) */

/* numbering inside num inputs stays LTR */
input[type="number"] { direction: ltr; text-align: left; }

/* tables nested inside filters keep clean look */
.neo-table-header-row-filter select { max-width: 220px; }
.neo-table-header-row-filter input { max-width: 220px; }

/* progress bars */
.progress {
    background: var(--voiz-surface-3);
    border-radius: 8px;
    box-shadow: none;
}
.progress-bar { background: var(--voiz-primary); }

/* voiz 3rd-level inline menu boxes */
.vertical_menu_visible table tr td {
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    border-top: 0;
}
.vertical_menu_visible table tr td a { color: var(--voiz-text-soft); }

/* ============================================================
   LOGIN PAGE  (#10)
   ============================================================ */
body.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 24px;
    background:
        radial-gradient(900px 480px at 85% -10%, var(--voiz-primary-soft), transparent 60%),
        radial-gradient(800px 460px at 8% 110%, var(--voiz-accent-soft), transparent 55%),
        var(--voiz-bg) !important;
}
.login-wrapper {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.login-wrapper .logovoiz {
    text-align: center;
    margin-bottom: 22px;
    pointer-events: none;
}
.login-wrapper .logovoiz img { width: 150px; height: auto; max-width: 70vw; }

#login {
    background: var(--voiz-surface);
    backdrop-filter: none;
    border: 1px solid var(--voiz-border);
    border-radius: 18px;
    padding: 30px 28px;
    width: 100%;
    box-shadow: var(--voiz-popover-shadow), 0 0 0 1px rgba(255,255,255,.04) inset;
}
.form-login-error,
body.login-page .form-login-error {
    display: none;
    background: var(--voiz-danger-soft);
    border: 1px solid var(--voiz-danger);
    color: var(--voiz-danger);
    padding: 12px 14px;
    border-radius: var(--voiz-radius-sm);
    margin-bottom: 18px;
    font-size: 12.5px;
    text-align: right;
    direction: rtl;
}
.form-login-error.show,
body.login-page .form-login-error.show { display: block; animation: voiz-fade .25s ease; }
.form-login-error h3 { margin: 0 0 4px; font-size: 14px; font-weight: 700; color: var(--voiz-danger); }
.form-login-error p { margin: 0; }

#login .voiz-login-field {
    margin-bottom: 14px;
    position: relative;
}
#login .voiz-login-field .voiz-login-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--voiz-muted);
    margin-bottom: 6px;
}
#login .voiz-login-field .voiz-login-label i { width: 14px; color: var(--voiz-primary); }
#login form fieldset input[type="text"],
#login form fieldset input[type="password"],
body.login-page #login input[type="text"],
body.login-page #login input[type="password"] {
    width: 100%;
    height: 44px;
    background: var(--voiz-inset);
    border: 1px solid var(--voiz-border);
    border-radius: var(--voiz-radius-sm);
    color: var(--voiz-text);
    font-family: "Vazirmatn", sans-serif;
    font-size: 13px;
    padding: 0 14px;
    text-align: right;
    direction: rtl;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    -webkit-transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
}

#login form fieldset input[type="text"]:focus,
#login form fieldset input[type="password"]:focus {
    border-color: var(--voiz-primary);
    background: var(--voiz-surface);
    box-shadow: 0 0 0 3px var(--voiz-primary-soft);
}
#login form fieldset input::placeholder { color: var(--voiz-muted); }

#login form fieldset input[type="submit"],
#login input[type="submit"],
body.login-page input[name="submit_login"] {
    width: 100%;
    height: 44px;
    background: var(--voiz-primary);
    border: 1px solid var(--voiz-primary);
    border-radius: var(--voiz-radius-sm);
    color: var(--voiz-primary-contrast);
    font-family: "Vazirmatn", sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0;
    text-align: center !important;
    -webkit-appearance: none;
    appearance: none;
    -webkit-transition: all .18s ease;
    transition: all .18s ease;
}
#login form fieldset input[type="submit"]:hover,
#login input[type="submit"]:hover {
    background: var(--voiz-primary-hover);
    border-color: var(--voiz-primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 8px 20px var(--voiz-primary-soft);
}
#login form fieldset input[type="submit"]:active { transform: none; }

body.login-page .fotter {
    margin-top: 24px;
    text-align: center;
    width: 100%;
    font-size: 11.5px;
    color: var(--voiz-muted);
}
body.login-page .fotter a { color: var(--voiz-accent-text); text-decoration: none; }
body.login-page .fotter a:hover { color: var(--voiz-primary); }
body.login-page .copyr p { margin: 0; font-size: 12px; }

/* theme toggle on login */
.voiz-login-theme {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 5;
}
.voiz-login-theme a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--voiz-surface);
    border: 1px solid var(--voiz-border);
    color: var(--voiz-text-soft);
    font-size: 16px;
    box-shadow: var(--voiz-card-shadow);
    -webkit-transition: all .2s ease;
    transition: all .2s ease;
}
.voiz-login-theme a:hover {
    border-color: var(--voiz-primary);
    color: var(--voiz-primary);
    transform: rotate(20deg);
}

/* ============================================================
   RESPONSIVE  (#3 #4 #7)
   ============================================================ */
@media (max-width: 1199px) {
    .voiz-topbar-search { max-width: 340px; }
    .voiz-topbar-logo kbd { display: none; }
}

@media (max-width: 991px) {
    .page-container, .page-container.sidebar-collapsed { padding-right: 0; }

    .page-container .sidebar-menu {
        position: fixed !important;
        top: 0; bottom: 0; right: 0;
        width: 280px;
        z-index: 10650;
        box-shadow: 8px 0 40px rgba(0, 0, 0, .3);
        -webkit-transform: translateX(105%);
        transform: translateX(105%);
        transition: transform .25s ease;
    }
    body.voiz-sidebar-open .page-container .sidebar-menu {
        -webkit-transform: translateX(0);
        transform: translateX(0);
    }
    .voiz-sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(8, 10, 14, .55);
        z-index: 10640;
        opacity: 0;
        visibility: hidden;
        -webkit-transition: opacity .2s ease, visibility .2s ease;
        transition: opacity .2s ease, visibility .2s ease;
        cursor: pointer;
    }
    body.voiz-sidebar-open .voiz-sidebar-overlay {
        opacity: 1;
        visibility: visible;
    }
    .voiz-topbar-user .voiz-user-name { display: none; }
}

@media (max-width: 767px) {
    .voiz-topbar { flex-wrap: wrap; height: auto; padding: 10px 12px; gap: 8px; }
    .voiz-topbar-search { order: 3; flex-basis: 100%; max-width: 100%; }
    .voiz-topbar-logo { order: 1; }
    .voiz-topbar-logo img { height: 34px; }
    .voiz-topbar-actions { order: 2; margin-right: auto; }
    .voiz-topbar-user { order: 2; }
    .voiz-topbar-actions > li > a { width: 32px !important; height: 32px !important; }
    .voiz-topbar-actions { gap: 4px; }
    .voiz-topbar-sep { display: none; }

    #neo-contentbox-maincolumn { padding: 12px 12px 20px; }
    .breadcrumb { padding: 10px 14px; overflow-x: auto; white-space: nowrap; }

    .neo-table-header-row {
        padding: 10px;
        gap: 6px;
    }
    .neo-table-header-row-filter { flex-wrap: wrap; }
    .neo-table-header-row-filter select,
    .neo-table-header-row-filter input { max-width: 100%; }
    .neo-table-header-row-navigation { flex-wrap: wrap; }

    .neo-modal-issabel-popup-box {
        width: calc(100vw - 24px) !important;
        max-height: calc(100vh - 40px);
        padding: 18px 16px !important;
    }
    .modal-dialog { margin: 12px auto; width: auto; }

    body.login-page { padding: 16px; }
    #login { padding: 26px 20px; }
}

@media (max-width: 480px) {
    .voiz-topbar-user { display: none; }
    .voiz-topbar-actions { margin-right: 0; }
}

/* print */
@media print {
    .sidebar-menu, .voiz-topbar, .breadcrumb, footer.main { display: none !important; }
    .page-container, .page-container.sidebar-collapsed { padding: 0 !important; }
    #neo-contentbox-maincolumn { padding: 0; }
}

/* ============================================================
   HARDENING - guarantee the redesign wins over legacy layers
   (neon/purple history, `body`-scoped leftovers). These mirror
   the key rules with higher specificity / !important.
   NOTE: css/purple.css is NOT loaded anymore by index.tpl.
   ============================================================ */
body a { color: var(--voiz-accent-text); }
body a:hover { color: var(--voiz-primary); }

body .page-container .sidebar-menu {
    background: var(--voiz-sidebar-bg);

}

}

body .page-container .sidebar-menu #main-menu > li { border-bottom: none; }

body .page-container .sidebar-menu #main-menu > li > a,
body .page-container .sidebar-menu #main-menu li ul > li > a,
body .page-container .sidebar-menu #main-menu li ul li ul li a,
body .page-container .sidebar-menu #main-menu li ul li ul li ul li a {

}
body .page-container .sidebar-menu #main-menu li.active > a {

}
body .page-container .sidebar-menu #main-menu li ul > li.active > a {

}
body .page-container .sidebar-menu #main-menu i,
body .page-container .sidebar-menu #main-menu li > a i,
body .page-container .sidebar-menu #main-menu li li > a > i {

}
body .page-container .sidebar-menu #main-menu li:hover i,

body .dropdown-menu {

}
body .dropdown-menu > li > a { color: var(--voiz-text-soft); }
body .dropdown-menu > li > a:hover,
body .dropdown-menu > li > a:focus {

}

body .btn-primary {

}
body .btn-primary:hover,
body .btn-primary:focus,
body .btn-primary:active,
body .open .dropdown-toggle.btn-primary {
    background: var(--voiz-primary-hover) !important;
    border-color: var(--voiz-primary-hover) !important;

body #chat {

}
body #chat .chat-header {
